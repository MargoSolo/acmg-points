[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmg-points"
version = "0.1.2"
description = "Points-based ACMG/AMP variant classification (Tavtigian 2020 naturally-scaled system, the basis of SVC v4) side by side with the 2015 combining rules — see where they disagree."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Margarita Soloshenko", email = "msoloshenk@gmail.com"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = []
keywords = ["ACMG", "AMP", "variant classification", "ClinGen", "SVI", "points", "Bayesian"]

[project.scripts]
acmg-points = "acmg_points.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/MargoSolo/acmg-points"
Documentation = "https://margosolo.github.io/acmg-points/"
Changelog = "https://github.com/MargoSolo/acmg-points/blob/main/CHANGELOG.md"
